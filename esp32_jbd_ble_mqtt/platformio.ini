; PlatformIO Projekt — ESP32 JBD BLE → MQTT Bridge
; 
; Install PlatformIO CLI: pip install platformio
; Build & Upload:   pio run -t upload
; Monitor:          pio device monitor

[platformio]
description = ESP32 BLE→MQTT Bridge für JBD/Jiabaida BMS
default_envs = esp32dev

[common]
build_flags = 
    -Wall
    -Werror=reorder
    -DARDUINOJSON_USE_LONG_LONG=1
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BTDM_CTRL_BLE_MAX_CONN=1

[env]
monitor_speed = 115200
monitor_filters = time, esp32_exception_decoder

; ============ ESP32 Dev Module ============
[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
board_build.flash_mode = dio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
lib_deps = 
    ; BLE — NimBLE (schmaler als Standard BLE)
    h2zero/NimBLE-Arduino@^1.4.2
    
    ; MQTT
    knolleary/PubSubClient@^2.8
    
    ; JSON
    bblanchon/ArduinoJson@^7.3

build_flags = ${common.build_flags}
    -mno-unaligned-access

; ============ ESP32-S3 (falls verwendet) ============
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = qio
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.partitions = default_16MB.csv
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3

build_flags = ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCONFIG_BT_NIMBLE_PINNED_TO_CORE_0=1

; ============ ESP32-C3 (falls verwendet) ============
[env:esp32c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
board_build.flash_mode = dio
board_build.f_cpu = 160000000L
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3

build_flags = ${common.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1

; ============ Custom (eigene Board-Definition) ============
[env:custom]
platform = espressif32
board = esp32dev
framework = arduino
lib_deps = 
    h2zero/NimBLE-Arduino@^1.4.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.3
build_flags = ${common.build_flags}